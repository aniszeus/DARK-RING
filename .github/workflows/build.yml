name: Build doomslayer.dll
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        shell: bash
        run: |
          unzip -q DARK-RING.zip
          git clone https://github.com/Dasaav-dsv/fromsoftware-rs.git DARK-RING/erfps2/fromsoftware-rs
          git -C DARK-RING/erfps2/fromsoftware-rs checkout 44a5603
      - uses: dtolnay/rust-toolchain@stable
      - name: Build doomslayer.dll
        working-directory: DARK-RING/doomslayer
        run: cargo build --release
      - name: Build erfps2.dll
        working-directory: DARK-RING/erfps2
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: dark-ring-dlls
          path: |
            DARK-RING/doomslayer/target/release/doomslayer.dll
            DARK-RING/erfps2/target/release/erfps2.dll
